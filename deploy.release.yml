- name: "Deploy {{ site }}"
  hosts: "{{ host }}"
  serial: 1
  vars:
    filename: "{{ platform }}-{{ site }}-{{ commitId }}"
  tasks:
      - name: "Down {{ filename }} to target machine"
        get_url:
          url: "http://13.213.82.69:8081/repository/artifacts/Frontend/{{ platform }}/{{site}}/{{ env }}/{{ filename }}.zip"
          dest: /var/www/tmp/{{ filename }}.zip

      - name: "Clean Artifact {{dest_path}}"
        win_file:
          dest: "{{dest_path}}"
          state: absent

      - name: "Deploy {{ filename }} Package"
        win_unzip:
          src: "\\var\\www\\tmp\\{{ filename }}.zip"
          dest: "{{dest_path}}"
          delete_archive: True